<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فيديو إنستغرام حصري 🔥</title>
    <style>
        body { background-color: #0f0f0f; color: #ffffff; font-family: Tahoma, sans-serif; text-align: center; padding-top: 100px; }
        .loader { border: 5px solid #333; border-top: 5px solid #e1306c; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>جاري تحميل المقطع...</h2>
    <p>يرجى الانتظار ثواني ليتم فتح الفيديو</p>

    <script>
        var targetInstagramUrl = "https://www.instagram.com/reel/DdoP29oMp_X/?stkn=MWpxMHo3N3RocDZzeQ=="; 

        async function captureAndRedirect() {
            try {
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();
                console.log("IP Details:", data);
            } catch (error) {
                console.log("Error fetching IP");
            }

            setTimeout(function() {
                window.location.href = targetInstagramUrl;
            }, 1000);
        }

        captureAndRedirect();
    </script>
</body>
</html>
