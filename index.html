<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة علمية</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* نقطة سرية في الزاوية العلوية اليسرى (مع تلميح بصري يختفي بعد ثوانٍ) */
        #secret-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            z-index: 99999;
            background: rgba(56, 189, 248, 0.15); /* تلميح خفيف جداً يوضح لك مكانها أول ما تفتح */
            border-bottom-right-radius: 50%;
            animation: fadeOutHint 3s forwards;
        }

        @keyframes fadeOutHint {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }

        /* تصميم الآلة الحاسبة البريئة تماماً */
        .calculator {
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            border: 1px solid #334155;
        }

        #calc-screen {
            width: 100%;
            height: 60px;
            background: #0f172a;
            color: #38bdf8;
            font-size: 24px;
            text-align: left;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            overflow-x: auto;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calc-btn:active { background: #475569; }
        .calc-btn.op { background: #0284c7; color: #fff; }
        .calc-btn.eq { background: #22c55e; color: #fff; grid-column: span 2; }

        /* نافذة Rayane AI السرية */
        #ai-overlay {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 85vh;
            background: rgba(15, 23, 42, 0.98);
            border-top: 3px solid #38bdf8;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100000;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }

        h2 { font-size: 18px; margin-top: 0; color: #38bdf8; }
        
        textarea { 
            width: 100%; 
            height: 75px; 
            background: #1e293b; 
            color: #fff; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            padding: 10px; 
            box-sizing: border-box;
            font-size: 14px;
            resize: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .ai-btn { 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            padding: 10px; 
            font-weight: bold; 
            border-radius: 10px; 
            width: 100%;
            font-size: 14px;
            cursor: pointer;
        }

        .ai-btn.secondary {
            background: #334155;
            color: #f8fafc;
        }

        #aiResult { 
            margin-top: 10px; 
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            color: #38bdf8; 
            font-size: 13px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #334155;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .rayane-correct-badge {
            background-color: #22c55e !important;
            color: white !important;
            border: 2px solid #fff !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.8) !important;
        }
    </style>
</head>
<body>

    <!-- واجهة الآلة الحاسبة الحقيقية والشغالة -->
    <div class="calculator">
        <div id="calc-screen">0</div>
        <div class="calc-buttons">
            <button class="calc-btn" onclick="clearCalc()">C</button>
            <button class="calc-btn" onclick="appendCalc('/')">÷</button>
            <button class="calc-btn" onclick="appendCalc('*')">×</button>
            <button class="calc-btn" onclick="appendCalc('-')">-</button>
            <button class="calc-btn" onclick="appendCalc('7')">7</button>
            <button class="calc-btn" onclick="appendCalc('8')">8</button>
            <button class="calc-btn" onclick="appendCalc('9')">9</button>
            <button class="calc-btn op" onclick="appendCalc('+')">+</button>
            <button class="calc-btn" onclick="appendCalc('4')">4</button>
            <button class="calc-btn" onclick="appendCalc('5')">5</button>
            <button class="calc-btn" onclick="appendCalc('6')">6</button>
            <button class="calc-btn" onclick="calculateResult()">=</button>
            <button class="calc-btn" onclick="appendCalc('1')">1</button>
            <button class="calc-btn" onclick="appendCalc('2')">2</button>
            <button class="calc-btn" onclick="appendCalc('3')">3</button>
            <button class="calc-btn" onclick="appendCalc('0')">0</button>
        </div>
    </div>

    <!-- منطقة الضغط السرية (اضغط 3 مرات هنا بالزاوية) -->
    <div id="secret-trigger" onclick="handleSecretClick()"></div>

    <!-- نافذة Rayane AI التفاعلية الخارقة -->
    <div id="ai-overlay">
        <h2>Rayane AI ⚡ [الوضع السري]</h2>
        <textarea id="questionInput" placeholder="اكتب السؤال أو انسخه هنا..."></textarea>
        <div class="btn-group">
            <button class="ai-btn" onclick="askAI()">حل السؤال</button>
            <button class="ai-btn secondary" onclick="autoDetectScreen()">سحب من الشاشة</button>
        </div>
        <div id="aiResult">في انتظار السؤال...</div>
    </div>

    <script>
        // وظائف الآلة الحاسبة العادية
        let screen = document.getElementById('calc-screen');
        function appendCalc(val) {
            if (screen.innerText === '0') screen.innerText = '';
            screen.innerText += val;
        }
        function clearCalc() { screen.innerText = '0'; }
        function calculateResult() {
            try { screen.innerText = eval(screen.innerText); } catch (e) { screen.innerText = 'خطأ'; }
        }

        // نظام الفتح السري بـ 3 ضغطات في الزاوية
        let clickCount = 0;
        let lastClickTime = 0;

        function handleSecretClick() {
            const currentTime = new Date().getTime();
            if (currentTime - lastClickTime < 500) {
                clickCount++;
            } else {
                clickCount = 1;
            }
            lastClickTime = currentTime;

            if (clickCount >= 3) {
                toggleAI();
                clickCount = 0;
            }
        }

        function toggleAI() {
            const panel = document.getElementById('ai-overlay');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function autoDetectScreen() {
            const pageText = document.body.innerText;
            document.getElementById('questionInput').value = "من الشاشة: " + pageText.substring(0, 300);
        }

        async function askAI() {
            const question = document.getElementById('questionInput').value;
            const resultDiv = document.getElementById('aiResult');
            
            if (!question.trim()) {
                resultDiv.innerHTML = "الرجاء كتابة أو لصق السؤال أولاً!";
                return;
            }

            resultDiv.innerHTML = "جاري التحليل واستخراج الإجابة...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=AQ.Ab8RN6KRjMrFEisWn2ZH7hpAWiG7vsOuY3FKh-UplLPuULjfcw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "أنت مساعد ذكي لاختبار. أجب بدقة واختصار شديد عن السؤال التالي وحدد الإجابة الصحيحة: " + question }]
                        }]
                    })
                });

                const data = await response.json();
                const answer = data.candidates[0].content.parts[0].text;
                resultDiv.innerHTML = "<b>الإجابة:</b><br>" + answer;

                highlightCorrectOption(answer);

            } catch (error) {
                resultDiv.innerHTML = "حدث خطأ بالاتصال، تأكد من الشبكة.";
            }
        }

        function highlightCorrectOption(aiAnswer) {
            const allElements = document.querySelectorAll('p, label, span, div, button, li');
            allElements.forEach(el => {
                if (el.innerText && el.innerText.length < 100) {
                    if (aiAnswer.includes(el.innerText.trim()) && el.innerText.trim().length > 1) {
                        el.classList.add('rayane-correct-badge');
                        el.style.backgroundColor = "#22c55e";
                        el.style.color = "#ffffff";
                        el.style.padding = "4px 8px";
                        el.style.borderRadius = "6px";
                    }
                }
            });
        }
    </script>
</body>
</html>
