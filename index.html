<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة علمية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
        }
        .calculator {
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
        }
        #display {
            background: #0f172a;
            color: #f8fafc;
            font-size: 2rem;
            text-align: right;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            min-height: 80px;
            word-break: break-all;
            border: 1px solid #334155;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            background: #334155;
            color: #fff;
            border: none;
            padding: 20px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: #475569;
        }
        button.operator {
            background: #3b82f6;
        }
        button.operator:active {
            background: #2563eb;
        }
        button.clear {
            background: #ef4444;
        }
        /* نافذة الذكاء الاصطناعي المخفية */
        #ai-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            z-index: 1000;
            padding: 20px;
            flex-direction: column;
            justify-content: space-between;
        }
        #ai-panel h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        #ai-input {
            width: 100%;
            height: 120px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            resize: none;
            margin-bottom: 10px;
        }
        #ai-output {
            flex-grow: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 1rem;
            line-height: 1.5;
        }
        .ai-btns {
            display: flex;
            gap: 10px;
        }
        .ai-btns button {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div id="display">0</div>
        
        <div class="buttons">
            <button class="operator" onclick="appendValue('-')">-</button>
            <button class="operator" onclick="appendValue('×')">×</button>
            <button class="operator" onclick="appendValue('÷')">÷</button>
            <button class="clear" onclick="clearCalc()">C</button>
            
            <button class="operator" onclick="appendValue('+')">+</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('7')">7</button>
            
            <button class="operator" onclick="calculate()">=</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('4')">4</button>
            
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('1')">1</button>
        </div>
    </div>

    <!-- لوحة المساعد السري -->
    <div id="ai-panel">
        <div>
            <h2>مساعد ريان الذكي</h2>
            <textarea id="ai-input" placeholder="اكتب السؤال أو انسخه هنا..."></textarea>
        </div>
        <div id="ai-output">النتائج والحلول ستظهر هنا...</div>
        <div class="ai-btns">
            <button class="clear" onclick="closeAI()">إغلاق</button>
            <button class="operator" onclick="askAI()">إرسال للحل</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = "0";

        function appendValue(val) {
            if (currentInput === "0") {
                currentInput = val;
            } else {
                currentInput += val;
            }
            display.innerText = currentInput;
        }

        function clearCalc() {
            currentInput = "0";
            display.innerText = currentInput;
        }

        function calculate() {
            // التحقق من الرقم السري لفتح الذكاء الاصطناعي
            if (currentInput.trim() === "3052") {
                document.getElementById('ai-panel').style.display = 'flex';
                clearCalc();
                return;
            }

            try {
                let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                currentInput = eval(sanitized).toString();
                display.innerText = currentInput;
            } catch (e) {
                display.innerText = "خطأ";
                currentInput = "0";
            }
        }

        function closeAI() {
            document.getElementById('ai-panel').style.display = 'none';
        }

        async function askAI() {
            const promptText = document.getElementById('ai-input').value;
            const outputDiv = document.getElementById('ai-output');
            
            if (!promptText.trim()) {
                outputDiv.innerText = "الرجاء إدخال سؤال أولاً.";
                return;
            }

            outputDiv.innerText = "جاري تحليل السؤال...";

            const apiKey = "AQ.Ab8RN6KRjMrFEisWn2ZH7hpAWiG7vsOuY3FKh-UplLPuULjfcw"; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "أجب عن هذا السؤال بدقة واختصار شديد: " + promptText }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    outputDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    outputDiv.innerText = "حدث خطأ في استخراج الإجابة.";
                }
            } catch (error) {
                outputDiv.innerText = "خطأ في الاتصال بالشبكة.";
            }
        }
    </script>
</body>
</html>
